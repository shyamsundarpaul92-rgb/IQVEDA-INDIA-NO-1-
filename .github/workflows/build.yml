name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config libltdl-dev ccache libffi-dev libssl-dev
          pip install --upgrade pip
          pip install Cython==0.29.36 buildozer virtualenv

      - name: Build with Buildozer
        env:
          CFLAGS: "-Wno-error -Wno-incompatible-pointer-types -Wno-deprecated-declarations"
          CXXFLAGS: "-Wno-error -Wno-incompatible-pointer-types -Wno-deprecated-declarations"
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IQVEDA_INDIA_NO_1_APK
          path: bin/*.apk
          
        
